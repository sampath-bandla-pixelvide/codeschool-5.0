<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz App</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
 
  </head>
  <body>
    <div class="container-fluid vh-100">
      <div class="row h-100">
        <!-- LEFT SIDE -->
        <div
          class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center text-white"
          style="background: linear-gradient(135deg, #4e73df, #1cc88a)"
        >
          <h1 class="fw-bold fs-0">QuizPro </h1>
          <p class="mt-3 text-center px-5 fs-5">
            Test your knowledge, track your performance, and improve your
            skills.
          </p>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-6 d-flex justify-content-center align-items-center" style="background:#ecf7f9;">
          <div
            class="card p-5 border-0 shadow"
            style="width: 480px; border-radius: 16px"
          >
            <div id="loginForm" >
              <h4 class="mb-3 text-center fw-bold fs-3">Welcome Back 👋</h4>

              <div class="input-group my-3 pt-4">
                <span class="input-group-text bg-white"
                  ><i class="bi bi-envelope"></i
                ></span>
                <input class="form-control " id="loginEmail" type="email" placeholder="Email"/>
              </div>
              <div class="input-group mb-3">
                <span class="input-group-text bg-white"
                  ><i class="bi bi-lock"></i
                ></span>
                <input class="form-control" id="loginPassword" type="password" placeholder="Password"/>
              </div>
              <div id="loginError"  class="small text-center text-danger "></div>

              <button class="btn btn-lg btn-primary w-100 mb-3" id="loginBtn" style="border-radius:10px;">
                Login
              </button>

              <p class="text-center mb-0">
                Don't have an account?
                <a href="#" id="showRegister">Register</a>
              </p>
            </div>

            <div id="registerForm" style="display: none">
              <h4 class="mb-3 text-center fw-bold fs-3">Register</h4>
              <div class="input-group pt-4 mb-3">
                <span class="input-group-text bg-white"
                  ><i class="bi bi bi-person"></i
                ></span>
                <input class="form-control " id="regName" type="text" placeholder="Name"/>
              </div>
              <div class="input-group mb-3">
                <span class="input-group-text bg-white"
                  ><i class="bi bi-envelope"></i
                ></span>
                <input class="form-control " id="regEmail" type="email" placeholder="Email"/>
              </div>
              
              <div class="input-group mb-3">
                <span class="input-group-text bg-white"
                  ><i class="bi bi-lock"></i
                ></span>
                <input class="form-control" id="regPassword" type="password" placeholder="Password"/>
              </div>
              <div id="registerError" class="small text-center text-danger"></div>

              <button class="btn btn-lg btn-success w-100 mb-3" id="registerBtn">
                Register
              </button>

              <p class="text-center mb-0">
                Already have an account?
                <a href="#" id="showLogin">Login</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
     <script src="js/index.js"></script>
  </body>
</html>
