<div class="mb-3">
  <h4 class="fw-bold">Admin Dashboard</h4>
  <p class="text-muted">Overview</p>
</div>

<div class="row g-3" id="adminStats">

  <div class="col-md-4 ">
    <div class="card stat-card text-center p-3">
      <div class="text-muted small">Total Users</div>
      <div class="fw-bold fs-2" id="totalUsers">0</div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card stat-card text-center p-3">
      <div class="text-muted small">Total Quizzes</div>
      <div class="fw-bold fs-2" id="totalQuizzes">0</div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card stat-card p-3 text-center">
      <div class="text-muted small">Total Attempts</div>
      <div class="fw-bold fs-2" id="totalAttempts">0</div>
    </div>
  </div>

</div>

<div class="card border-0 shadow-sm rounded-4 mt-4">
  <div class="card-body">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold mb-0">Recent Attempts</h6>
    </div>

    <table class="table align-middle mb-0 attempts-table">
      <thead>
        <tr class="text-muted small">
          <th class="text-center">User</th>
          <th class="text-center">Quiz</th>
          <th class="text-center">Score</th>
          <th class="text-center">Date</th>
        </tr>
      </thead>

      <tbody id="adminRecentAttempts">
        <tr>
          <td colspan="4" class="text-center text-muted py-4">Loading...</td>
        </tr>
      </tbody>
    </table>

  </div>
</div>
