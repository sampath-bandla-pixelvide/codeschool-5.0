<div class="mb-3 sticky-top" style="top: 20px;">
  <button class="btn btn-sm btn-outline-secondary" id="backToQuizzes">
    ← Back to Quizzes
  </button>
</div>

<div class="row g-4">

  <!-- left form -->
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4 sticky-form">

      <h5 class="fw-bold mb-3">Add Question</h5>

      <input type="hidden" id="quizId" />

      <div class="mb-3">
        <label class="form-label">Question</label>
        <textarea class="form-control" id="questionText" rows="3"></textarea>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6"><input class="form-control" id="opt1" placeholder="Option 1"></div>
        <div class="col-6"><input class="form-control" id="opt2" placeholder="Option 2"></div>
        <div class="col-6"><input class="form-control" id="opt3" placeholder="Option 3"></div>
        <div class="col-6"><input class="form-control" id="opt4" placeholder="Option 4"></div>
      </div>

      <div class="mb-3">
        <label class="form-label">Correct Answer</label><br>
        <label><input type="radio" name="correct" value="1"> 1</label>
        <label class="ms-3"><input type="radio" name="correct" value="2"> 2</label>
        <label class="ms-3"><input type="radio" name="correct" value="3"> 3</label>
        <label class="ms-3"><input type="radio" name="correct" value="4"> 4</label>
      </div>

      <div id="questionError" class="text-danger small mb-2"></div>

      <button class="btn btn-primary w-100" id="addQuestionBtn">
        Add Question
      </button>

    </div>
  </div>

  <!-- right list -->
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4">

      <h5 class="fw-bold mb-3">Questions</h5>

      <div id="questionsList">
        <p class="text-muted">Loading...</p>
      </div>

    </div>
  </div>

</div>
