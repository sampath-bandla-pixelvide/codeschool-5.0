  </div>

  <button class="btn btn-primary" id="createSubjectBtn">

  </button>
</div>

        <tr>

          <th>Subject</th>
          <th>Quizzes</th>
          <th class="text-center" style="width: 120px;">Actions</th>

      <tbody id="subjectsTable">
        <tr>
          <td colspan="4" class="text-center text-muted py-4">

    </table>
