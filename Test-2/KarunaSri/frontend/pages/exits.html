<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exit Management | ORR Toll</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="bg-light">
    <div class="d-flex">
      <div id="sidebar-container"></div>
      <div class="flex-grow-1">
        <div id="navbar-container"></div>

        <div class="container-fluid px-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h4 class="fw-bold mb-0">Exit Plazas</h4>
              <p class="text-muted small">Manage ORR entry and exit points</p>
            </div>
            <button
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#addExitModal"
            >
              <i class="bi bi-plus-lg me-2"></i> Add New Plaza
            </button>
          </div>

          <div class="row g-4" id="exitList">
            <!-- Loaded dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- Add Exit Modal -->
    <div class="modal fade" id="addExitModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Add New Exit Plaza</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="addExitForm">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label class="form-label">Plaza Name</label>
                <input
                  type="text"
                  name="exit_name"
                  class="form-control"
                  placeholder="e.g. Exit 1.."
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Location / Landmark</label>
                <input
                  type="text"
                  name="location"
                  class="form-control"
                  placeholder="e.g. Near Financial District"
                  required
                />
              </div>
            </div>
            <div class="modal-footer border-0">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary px-4">
                Save Plaza
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editExitModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editExitForm">
            <div class="modal-header">
              <h5>Edit Exit</h5>
            </div>

            <div class="modal-body">
              <input type="hidden" name="id" />

              <div class="mb-3">
                <label>Exit Name</label>

                <input type="text" name="exit_name" class="form-control" />
              </div>

              <div class="mb-3">
                <label>Location</label>

                <input type="text" name="location" class="form-control" />
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary">Update Exit</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/exits.js"></script>
  </body>
</html>
