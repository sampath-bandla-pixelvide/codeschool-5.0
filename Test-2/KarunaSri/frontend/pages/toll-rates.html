<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toll Rate Management | ORR Toll</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="bg-light">
    <div class="d-flex">
      <div id="sidebar-container"></div>
      <div class="flex-grow-1">
        <div id="navbar-container"></div>

        <div class="container-fluid px-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h4 class="fw-bold mb-0">Toll Rates</h4>
              <p class="text-muted small">
                Configure journey costs between exits
              </p>
            </div>
            <button
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#addRateModal"
            >
              <i class="bi bi-plus-lg me-2"></i> Configure Rate
            </button>
          </div>

          <div class="card p-4">
            <div class="table-responsive">
              <table class="table table-hover" id="ratesTable">
                <thead>
                  <tr>
                    <th>Entry Point</th>
                    <th>Destination</th>
                    <th>Amount (₹)</th>
                    <th>Last Updated</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Loaded dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Rate Modal -->
    <div class="modal fade" id="addRateModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Configure Route Rate</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="addRateForm">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label class="form-label">From (Entry Exit)</label>
                <select
                  name="entry_exit_id"
                  id="entrySelect"
                  class="form-select"
                  required
                >
                  <option value="">Select entry point...</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">To (Destination Exit)</label>
                <select
                  name="destination_exit_id"
                  id="destSelect"
                  class="form-select"
                  required
                >
                  <option value="">Select destination point...</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Toll Amount (₹)</label>
                <div class="input-group">
                  <span class="input-group-text">₹</span>
                  <input
                    type="number"
                    name="amount"
                    class="form-control"
                    step="0.01"
                    placeholder="0.00"
                    required
                  />
                </div>
              </div>
            </div>
            <div class="modal-footer border-0">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary px-4">
                Save Rate
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editRateModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editRateForm">
            <div class="modal-header">
              <h5>Edit Toll Rate</h5>
            </div>

            <div class="modal-body">
              <input type="hidden" name="id" />

              <div class="mb-3">
                <label>Entry Exit</label>

                <select
                  name="entry_exit_id"
                  id="editEntrySelect"
                  class="form-control"
                ></select>
              </div>

              <div class="mb-3">
                <label>Destination Exit</label>

                <select
                  name="destination_exit_id"
                  id="editDestSelect"
                  class="form-control"
                ></select>
              </div>

              <div class="mb-3">
                <label>Amount</label>

                <input
                  type="number"
                  step="0.01"
                  name="amount"
                  class="form-control"
                />
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary">Update Rate</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/toll-rates.js"></script>
  </body>
</html>
