<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management | ORR Toll</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .avatar-circle-sm {
        width: 32px;
        height: 32px;
        background: #e9ecef;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: bold;
        color: #4e73df;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="d-flex">
      <div id="sidebar-container"></div>
      <div class="flex-grow-1">
        <div id="navbar-container"></div>

        <div class="container-fluid px-4">
          <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5 class="fw-bold mb-0">Team Members</h5>
              <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addEmployeeModal"
              >
                <i class="bi bi-plus-lg me-2"></i> Add Employee
              </button>
            </div>

            <div class="table-responsive">
              <table class="table table-hover" id="employeeTable">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Loaded dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal fade" id="addEmployeeModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Register New Employee</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="addEmployeeForm">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label class="form-label">First Name</label>
                <input
                  type="text"
                  name="first_name"
                  class="form-control"
                  required
                />
                <label class="form-label">Last Name</label>
                <input
                  type="text"
                  name="last_name"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Temporary Password</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  required
                  minlength="6"
                />
              </div>
            </div>
            <div class="modal-footer border-0">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary px-4">
                Create Account
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Employee Modal -->

    <div class="modal fade" id="editEmployeeModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editEmployeeForm">
            <div class="modal-header">
              <h5>Edit Employee</h5>
            </div>

            <div class="modal-body">
              <input type="hidden" name="id" />

              <div class="mb-3">
                <label>First Name</label>
                <input type="text" name="first_name" class="form-control" />
              </div>

              <div class="mb-3">
                <label>Last Name</label>
                <input type="text" name="last_name" class="form-control" />
              </div>

              <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" />
              </div>

              <div class="mb-3">
                <label>Role</label>

                <select name="role" class="form-control">
                  <option value="employee">Employee</option>
                  <option value="admin">Admin</option>
                </select>
              </div>

              <div class="mb-3">
                <label>Status</label>

                <select name="is_active" class="form-control">
                  <option value="true">Active</option>
                  <option value="false">Inactive</option>
                </select>
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary">Update Employee</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/app.js"></script>

    <script src="../assets/js/employees.js"></script>
  </body>
</html>
