<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Exit & Payment | ORR Toll</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="bg-light">
    <div class="d-flex">
      <div id="sidebar-container"></div>
      <div class="flex-grow-1">
        <div id="navbar-container"></div>

        <div class="container-fluid px-4">
          <div class="row g-4">
            <!-- Search Token -->
            <div class="col-lg-5">
              <div class="card p-4 h-100">
                <h5 class="fw-bold mb-4">Search Trip Token</h5>
                <div class="input-group input-group-lg mb-4">
                  <span class="input-group-text bg-white border-end-0"
                    ><i class="bi bi-search"></i
                  ></span>
                  <input
                    type="text"
                    id="tokenSearch"
                    class="form-control border-start-0"
                    placeholder="Enter Token Number..."
                  />
                  <button class="btn btn-primary" id="searchBtn">Search</button>
                </div>

                <div id="searchPlaceholder" class="text-center py-5 text-muted">
                  <i class="bi bi-qr-code-scan display-1 opacity-10"></i>
                  <p class="mt-3">
                    Enter a valid token number to fetch trip details
                  </p>
                </div>

                <div id="tripDetails" class="animate-fade-in d-none">
                  <div class="bg-light p-4 rounded-4 mb-4">
                    <div class="row g-3">
                      <div class="col-6">
                        <div class="small text-muted">Vehicle Number</div>
                        <div class="fw-bold fs-5" id="detVehicle">-</div>
                      </div>
                      <div class="col-6 text-end">
                        <div class="small text-muted">Status</div>
                        <span
                          class="status-badge bg-success bg-opacity-10 text-success"
                          id="detStatus"
                          >Active</span
                        >
                      </div>
                      <div class="col-12"><hr class="my-1" /></div>
                      <div class="col-6">
                        <div class="small text-muted">Entry Plaza</div>
                        <div class="fw-bold" id="detEntry">-</div>
                      </div>
                      <div class="col-6 text-end">
                        <div class="small text-muted">Entry Time</div>
                        <div class="fw-bold" id="detTime">-</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Payment Processing -->
            <div class="col-lg-7">
              <div
                class="card p-4 h-100"
                id="paymentCard"
                style="opacity: 0.5; pointer-events: none"
              >
                <h5 class="fw-bold mb-4">Toll Calculation & Payment</h5>

                <form id="exitForm">
                  <input type="hidden" name="token_number" id="hiddenToken" />

                  <div class="mb-4">
                    <label class="form-label fw-bold"
                      >Destination Exit Plaza</label
                    >
                    <select
                      name="exit_exit_id"
                      id="exitPlazaSelect"
                      class="form-select form-control-lg"
                      required
                    >
                      <option value="">Select exit point...</option>
                    </select>
                  </div>

                  <div
                    class="bg-dark text-white p-4 rounded-4 mb-4 d-flex justify-content-between align-items-center"
                  >
                    <div>
                      <div class="text-white-50 small fw-bold text-uppercase">
                        Toll Amount Due
                      </div>
                      <h1 class="mb-0 fw-bold" id="calcAmount">₹ 0.00</h1>
                    </div>
                    <div class="text-end">
                      <i class="bi bi-receipt fs-1 text-white-50"></i>
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label fw-bold mb-3"
                      >Select Payment Method</label
                    >
                    <div class="row g-3">
                      <div class="col-4">
                        <input
                          type="radio"
                          class="btn-check"
                          name="payment_method"
                          id="payCash"
                          value="cash"
                          checked
                        />
                        <label
                          class="btn btn-outline-primary w-100 py-3"
                          for="payCash"
                        >
                          <i class="bi bi-cash fs-4 d-block mb-1"></i> Cash
                        </label>
                      </div>
                      <div class="col-4">
                        <input
                          type="radio"
                          class="btn-check"
                          name="payment_method"
                          id="payCard"
                          value="card"
                        />
                        <label
                          class="btn btn-outline-primary w-100 py-3"
                          for="payCard"
                        >
                          <i class="bi bi-credit-card fs-4 d-block mb-1"></i>
                          Card
                        </label>
                      </div>
                      <div class="col-4">
                        <input
                          type="radio"
                          class="btn-check"
                          name="payment_method"
                          id="payUPI"
                          value="upi"
                        />
                        <label
                          class="btn btn-outline-primary w-100 py-3"
                          for="payUPI"
                        >
                          <i class="bi bi-qr-code fs-4 d-block mb-1"></i> UPI
                        </label>
                      </div>
                    </div>
                  </div>

                  <button
                    type="submit"
                    class="btn btn-primary w-100 btn-lg py-3 fw-bold"
                    id="completeBtn"
                  >
                    Complete Payment & Close Trip
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/vehicle-exit.js"></script>
  </body>
</html>
