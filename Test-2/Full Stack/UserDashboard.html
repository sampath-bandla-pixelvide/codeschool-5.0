<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: #07142b;
        font-family: "Poppins", sans-serif;
        color: white;
      }

      #topNavbar {
        background: #1b2741;
      }

      #logoIcon {
        width: 45px;
        height: 45px;
        background: #16c784;
        border-radius: 12px;
        font-size: 20px;
      }

      #bookBtn {
        background: #16c784;
        border: none;
        font-weight: 600;
      }

      #heroSection {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: linear-gradient(to bottom, #07142b, #0d2245);
      }

      #heroTitle {
        font-size: 60px;
        font-weight: 700;
      }

      #heroText {
        color: #92a6c9;
        font-size: 20px;
      }

      #heroBookBtn {
        background: #16c784;
        border: none;
        font-weight: 600;
        height: 55px;
        padding: 0 35px;
      }

      #servingSection {
        background: linear-gradient(to right, #032b35, #08384a);
      }

      #tokenCircle {
        width: 70px;
        height: 70px;
        background: #16c784;
        border-radius: 50%;
        font-size: 28px;
        font-weight: 700;
        animation: pulseBlink 2.5s infinite;
      }

      #currentTokenNumber {
        animation: pulseBlink 0.5s infinite;
      }

      .dashboardCard {
        background: #1a2742;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
      }

      .form-control,
      .form-select {
        background: #071432;
        border: 1px solid #394a68;
        color: white;
        height: 48px;
      }

      .form-control:focus,
      .form-select:focus {
        background: #071432;
        color: white;
        border-color: #16c784;
        box-shadow: none;
      }

      .form-control::placeholder {
        color: #8fa4c6;
      }

      .form-label {
        color: #a5b8d8;
      }

      #generateTokenBtn {
        background: #16c784;
        border: none;
        height: 50px;
        font-weight: 600;
      }

      .statusBox {
        background: #071432;
        border-radius: 16px;
      }

      .statusNumber {
        font-size: 30px;
        font-weight: 700;
      }

      #waitingCount {
        color: #ffbd2f;
      }

      #calledCount {
        color: #4b9fff;
      }

      #completedCount {
        color: #35e8a2;
      }

      #cancelledCount {
        color: #ff6b78;
      }

      #queueMessage {
        color: #6f85aa;
      }

      @media (max-width: 768px) {
        #bookBtn {
          display: none;
        }
      }
      #profileSidebar {
        position: fixed;

        top: 0;
        right: -380px;

        width: 360px;
        height: 100vh;

        background: #111c33;

        z-index: 9999;

        padding: 30px;

        transition: 0.4s;

        overflow-y: auto;

        box-shadow: -5px 0 25px rgba(0, 0, 0, 0.4);
      }

      #profileSidebar.activeSidebar {
        right: 0;
      }

      #sidebarOverlay {
        position: fixed;

        inset: 0;

        background: rgba(0, 0, 0, 0.5);

        z-index: 9998;

        opacity: 0;

        visibility: hidden;

        transition: 0.3s;
      }

      #sidebarOverlay.activeOverlay {
        opacity: 1;

        visibility: visible;
      }

      #closeSidebarBtn {
        background: none;

        border: none;

        color: white;

        font-size: 22px;
      }

      #sidebarProfileCircle {
        width: 90px;
        height: 90px;

        border-radius: 50%;

        background: #16c784;

        font-size: 35px;
        font-weight: 700;

        color: white;
      }

      #saveProfileBtn {
        background: #16c784;

        border: none;

        height: 48px;
      }

      @keyframes pulseBlink {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0px rgba(22, 199, 132, 0.4);
        }

        50% {
          transform: scale(1.08);
          box-shadow: 0 0 25px rgba(22, 199, 132, 0.9);
        }

        100% {
          transform: scale(1);
          box-shadow: 0 0 0px rgba(22, 199, 132, 0.4);
        }
      }
    </style>
  </head>

  <body>
    <nav
      id="topNavbar"
      class="navbar navbar-expand-lg px-3 py-3 border-bottom border-secondary-subtle sticky-top"
    >
      <div class="container-fluid">
        <div class="d-flex align-items-center gap-3">
          <div
            id="logoIcon"
            class="d-flex justify-content-center align-items-center text-white fw-bold"
          >
            <i class="bi bi-hospital"></i>
          </div>

          <h3 id="clinicTitle" class="mb-0 fw-semibold fs-4">
            City Health Clinic
          </h3>
        </div>

        <div class="d-flex align-items-center gap-3">
          <button id="bookBtn" class="btn text-white px-4 py-2 rounded-3">
            Book Appointment
          </button>

          <div id="userProfileWrapper" class="d-flex align-items-center gap-2">
            <div
              id="userProfileCircle"
              class="d-flex justify-content-center align-items-center text-white fw-semibold"
              style="
                width: 42px;
                height: 42px;
                border-radius: 50%;
                background: #16c784;
                font-size: 18px;
              "
            ></div>

            <span id="userNameText" class="fw-medium"></span>
          </div>
        </div>
      </div>
    </nav>

    <section id="servingSection" class="py-4">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-md-10">
            <p id="servingTitle" class="text-secondary mb-1 fs-5">
              Now Serving
            </p>

            <p id="servingText" class="mb-0">
              Welcome! Please book your token below.
            </p>
          </div>

          <div class="col-md-2 text-md-end mt-3 mt-md-0 pe-lg-5">
            <div
              id="tokenCircle"
              class="d-inline-flex justify-content-center align-items-center"
            >
              <span id="currentTokenNumber"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="mainSection" class="py-5">
      <div class="container">
        <div class="row g-4 justify-content-center">
          <div class="col-lg-5">
            <div id="bookingCard" class="dashboardCard p-4 h-100">
              <h4 id="bookingTitle" class="fw-semibold mb-4">
                Book Your Appointment
              </h4>

              <div class="mb-3">
                <label for="fullNameInput" class="form-label">
                  Full Name
                </label>

                <input
                  type="text"
                  id="fullNameInput"
                  class="form-control"
                  placeholder="Enter your full name"
                />
              </div>

              <div class="mb-3">
                <label for="mobileInput" class="form-label">
                  Mobile Number
                </label>

                <input
                  type="text"
                  id="mobileInput"
                  class="form-control"
                  placeholder="Enter mobile number"
                />
              </div>

              <div class="mb-4">
                <label for="purposeSelect" class="form-label">
                  Purpose Of Visit
                </label>

                <select id="purposeSelect" class="form-select">
                  <option>General Consultation</option>
                  <option>Lab Report</option>
                  <option>Vaccination</option>
                  <option>Other</option>
                </select>
              </div>

              <button
                id="generateTokenBtn"
                class="btn text-white w-100 rounded-3"
              >
                Book Appointment
              </button>
            </div>
          </div>

          <div class="col-lg-5">
            <div id="queueCard" class="dashboardCard p-4 h-100">
              <h4 id="queueTitle" class="fw-semibold mb-4">Queue Status</h4>

              <div class="row g-3">
                <div class="col-6">
                  <div class="statusBox text-center py-4">
                    <div id="waitingCount" class="statusNumber">0</div>

                    <div class="text-secondary">Waiting</div>
                  </div>
                </div>

                <div class="col-6">
                  <div class="statusBox text-center py-4">
                    <div id="calledCount" class="statusNumber">0</div>

                    <div class="text-secondary">Called</div>
                  </div>
                </div>
              </div>

              <div id="queueMessage" class="text-center mt-5 fs-5">
                No one in queue
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="profileSidebar">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Profile</h4>

        <button id="closeSidebarBtn">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

        <h5 id="sidebarUserName" class="mt-3">User Name</h5>

      <button id="logoutBtn" class="btn btn-danger w-100">Logout</button>
    </div>

    <div id="sidebarOverlay"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./scripts/userDashboard.js"></script>
  </body>
</html>
