<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #07142b;
        color: white;
      }

      #topNavbar {
        background: #1b2741;
      }

      #logoIcon {
        width: 45px;
        height: 45px;
        background: #16c784;
        border-radius: 12px;
        font-size: 20px;
      }

      #clinicTitle {
        color: white;
      }

      #bookingsBtn {
        background: #16c784;
        border: none;
        font-weight: 600;
      }

      #adminProfileCircle {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #16c784;
        font-size: 18px;
      }

      #dashboardContainer {
        padding: 35px;
      }

      .dashboardCard {
        background: #172742;
        border-radius: 24px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      #dashboardHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      #dashboardTitle {
        font-size: 32px;
        font-weight: 600;
      }

      #callNextBtn {
        border: none;
        background: #6668ff;
        color: white;
        padding: 14px 28px;
        border-radius: 14px;
        font-size: 18px;
        font-weight: 500;
      }

      #tokenList {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .tokenCard {
        background: #061432;
        border-radius: 14px;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 62px;
      }

      .tokenLeft {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .tokenNumber {
        font-size: 20px;
        font-weight: 700;
        width: 34px;
        color: #16c784;
      }

      .tokenDetails {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .tokenName {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.1;
      }

      .tokenInfo {
        font-size: 11px;
        color: #8fa2c7;
        line-height: 1.1;
      }

      .tokenActions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .waitingBtn,
      .calledBtn,
      .doneBtn,
      .cancelBtn {
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
      }
      .waitingBtn {
        border: none;
        background: #4a3908;
        color: #ffcc33;
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
      }
      .calledBtn {
        border: none;
        background: #0b2f6f;
        color: #5fa3ff;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 15px;
      }

      .doneBtn {
        border: none;
        background: #083f39;
        color: #57f5bb;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 15px;
      }

      .cancelBtn {
        border: none;
        background: #4c1d2a;
        color: #ff9aa7;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 15px;
      }

      .statusBox {
        background: #061432;
        border-radius: 18px;
      }

      .statusNumber {
        font-size: 32px;
        font-weight: 700;
      }

      #waitingCount {
        color: #ffbd2f;
      }

      #calledCount {
        color: #5fa3ff;
      }

      #completedCount {
        color: #57f5bb;
      }

      #cancelledCount {
        color: #ff9aa7;
      }

      #queueMessage {
        color: #8fa2c7;
      }
      .navBtn {
        border: none;
        background: transparent;
        color: #c7d2e3;
        padding: 6px 2px;
        font-weight: 500;
        position: relative;
        transition: 0.3s;
      }

      .navBtn::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 0%;
        height: 2px;
        background: #16c784;
        transition: 0.3s;
      }

      .navBtn:hover {
        color: white;
      }

      .activeNavBtn {
        color: white;
      }

      .activeNavBtn::after {
        width: 100%;
      }

      @media (max-width: 768px) {
        #dashboardContainer {
          padding: 18px;
        }

        #dashboardHeader {
          flex-direction: column;
          gap: 20px;
          align-items: flex-start;
        }

        .tokenCard {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }

        .tokenActions {
          width: 100%;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

  <body>
    <nav
      id="topNavbar"
      class="navbar navbar-expand-lg px-3 py-3 border-bottom border-secondary-subtle sticky-top"
    >
      <div class="container-fluid">
        <div class="d-flex align-items-center gap-3">
          <div
            id="logoIcon"
            class="d-flex justify-content-center align-items-center text-white fw-bold"
          >
            <i class="bi bi-hospital"></i>
          </div>

          <h3 id="clinicTitle" class="mb-0 fw-semibold fs-4">
            City Health Clinic
          </h3>
        </div>

        <div class="d-flex align-items-center gap-4">
          <button id="dashboardBtn" class="navBtn activeNavBtn">
            Dashboard
          </button>

          <button id="bookingBtn" class="navBtn">Bookings</button>
        </div>

        <div id="adminProfileWrapper" class="d-flex align-items-center gap-2">
          <div
            id="adminProfileCircle"
            class="d-flex justify-content-center align-items-center text-white fw-semibold"
          ></div>

          <span id="adminNameText" class="fw-medium"> </span>
        </div>
      </div>
    </nav>

    <section id="dashboardContainer">
      <div class="row g-4">
        <div class="col-lg-8" id="dashboardSection">
          <div class="dashboardCard">
            <div id="dashboardHeader">
              <h1 id="dashboardTitle">Admin Dashboard</h1>
            </div>
            <div id="tokenList"></div>

            <div
              class="d-flex justify-content-center align-items-center gap-3 mt-4"
            >
              <button id="prevPageBtn" class="btn btn-outline-light">
                Previous
              </button>

              <span id="currentPageText"> Page 1 </span>

              <button id="nextPageBtn" class="btn btn-outline-light">
                Next
              </button>
            </div>
          </div>
        </div>

        <div class="col-lg-4" id="queueSection">
          <div id="queueCard" class="dashboardCard h-100">
            <h4 id="queueTitle" class="fw-semibold mb-4">Queue Status</h4>

            <div class="row g-3">
              <div class="col-6">
                <div class="statusBox text-center py-4">
                  <div id="waitingCount" class="statusNumber"></div>

                  <div class="text-secondary">Waiting</div>
                </div>
              </div>

              <div class="col-6">
                <div class="statusBox text-center py-4">
                  <div id="calledCount" class="statusNumber"></div>

                  <div class="text-secondary">Called</div>
                </div>
              </div>

              <div class="col-6">
                <div class="statusBox text-center py-4">
                  <div id="completedCount" class="statusNumber"></div>

                  <div class="text-secondary">Completed</div>
                </div>
              </div>

              <div class="col-6">
                <div class="statusBox text-center py-4">
                  <div id="cancelledCount" class="statusNumber"></div>

                  <div class="text-secondary">Cancelled</div>
                </div>
              </div>
            </div>

            <div id="queueMessage" class="text-center mt-5 fs-5"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="bookingsSection" style="display: none" class="p-4">
      <div class="dashboardCard">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="mb-0">User Bookings</h2>

          <button id="callNextBtn">Call Next</button>
        </div>

        <div id="bookingsList"></div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./scripts/adminDashboard.js"></script>
  </body>
</html>
