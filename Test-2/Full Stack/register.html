<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register Page</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Poppins Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(to bottom, #07142b, #0d2245);
        min-height: 100vh;
        font-family: "Poppins", sans-serif;
        color: white;
      }

      .register-wrapper {
        min-height: 100vh;
      }

      .register-card {
        background: #1a2742;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        backdrop-filter: blur(10px);
      }

      .main-color {
        color: #16c784;
      }

      #logoIcon {
        width: 70px;
        height: 70px;
        background: #16c784;
        border-radius: 18px;
        font-size: 30px;
      }

      .register-subtitle {
        color: #92a6c9;
      }

      .form-control {
        background: #071432;
        border: 1px solid #394a68;
        color: white;
        height: 55px;
        border-radius: 14px;
      }

      .form-control:focus {
        background: #071432;
        color: white;
        border-color: #16c784;
        box-shadow: none;
      }

      .form-control::placeholder {
        color: #8fa4c6;
      }

      .form-floating label {
        color: #8fa4c6;
      }

      .form-floating > label {
        background: transparent !important;
        color: #8fa4c6 !important;
      }

      .btn-custom {
        background: #16c784;
        border: none;
        color: white;
        font-weight: 600;
        height: 52px;
        border-radius: 14px;
        transition: 0.3s ease;
      }

      .btn-custom:hover {
        background: #12b977;
        color: white;
        transform: translateY(-1px);
      }

      .text-decoration-none {
        transition: 0.2s ease;
      }

      .text-decoration-none:hover {
        color: #12b977 !important;
      }

      .invalid-feedback {
        color: #ff6b78;
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
      }

      @media (max-width: 576px) {
        .register-card {
          padding: 1.5rem !important;
        }

        #logoIcon {
          width: 60px;
          height: 60px;
          font-size: 24px;
        }
      }
      .form-floating > label::after {
  background: #071432 !important;
}
    </style>
  </head>

  <body>
    <div class="container py-4">
      <div
        class="row justify-content-center align-items-center register-wrapper"
      >
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-lg register-card p-4">
            <!-- Logo -->
            <div class="text-center mb-4">
              <div
                id="logoIcon"
                class="d-inline-flex justify-content-center align-items-center text-white fw-bold mb-3"
              >
                <i class="bi bi-hospital"></i>
              </div>

              <h2 class="fw-bold main-color mb-2">Create Account</h2>

              <p class="register-subtitle mb-0">
                Register to book appointments and manage your queue
              </p>
            </div>

            <form id="registerForm">
              <!-- First & Last Name -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <div class="form-floating">
                    <input
                      type="text"
                      class="form-control"
                      id="firstName"
                      placeholder="First Name"
                    />

                    <label for="firstName"> First Name </label>

                    <div class="invalid-feedback">
                      First name must be 3-20 characters
                    </div>
                  </div>
                </div>

                <div class="col-md-6 mb-3">
                  <div class="form-floating">
                    <input
                      type="text"
                      class="form-control"
                      id="lastName"
                      placeholder="Last Name"
                    />

                    <label for="lastName"> Last Name </label>

                    <div class="invalid-feedback">
                      Last name must be 3-20 characters
                    </div>
                  </div>
                </div>
              </div>

              <!-- Email -->
              <div class="form-floating mb-3">
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Email"
                />

                <label for="email"> Email Address </label>

                <div class="invalid-feedback">Enter valid email</div>
              </div>

              <!-- Phone Number -->
              <div class="form-floating mb-3">
                <input
                  type="tel"
                  class="form-control"
                  id="phoneNumber"
                  placeholder="Phone Number"
                />

                <label for="phoneNumber"> Phone Number </label>

                <div class="invalid-feedback">Enter valid phone number</div>
              </div>

              <!-- DOB -->
              <div class="form-floating mb-3">
                <input
                  type="date"
                  class="form-control"
                  id="dob"
                  placeholder="Date of Birth"
                />

                <label for="dob"> Date of Birth </label>

                <div class="invalid-feedback">Date of birth required</div>
              </div>

              <!-- Password -->
              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Password"
                />

                <label for="password"> Password </label>

                <div class="invalid-feedback">
                  Minimum 8 chars & 1 special character
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="form-floating mb-4">
                <input
                  type="password"
                  class="form-control"
                  id="confirmPassword"
                  placeholder="Confirm Password"
                />

                <label for="confirmPassword"> Confirm Password </label>

                <div class="invalid-feedback">Passwords do not match</div>
              </div>

              <!-- Register Button -->
              <button
                type="submit"
                id="registerBtn"
                class="btn btn-custom w-100"
              >
                Register
              </button>

              <!-- Login Link -->
              <p class="text-center mt-4 mb-0 register-subtitle">
                Already have an account?

                <a
                  href="./index.html"
                  id="loginLink"
                  class="text-decoration-none main-color fw-semibold"
                >
                  Login
                </a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- jQuery -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script src="./scripts/register.js"></script>
  </body>
</html>
