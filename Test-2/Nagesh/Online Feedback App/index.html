<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Feedback Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles/index.css">

</head>
<body class="row g-0 p-0 m-0 min-vh-100">
  <div class="left-container d-flex flex-column justify-content-center align-items-center p-4 p-md-5 col-12 col-md-5 min-vh-100">
    <div class="w-100" style="max-width: 400px;">

      <h1 class="fw-bold mb-2">Welcome Back</h1>
      <p class="text-secondary mb-5">Enter your details to access your dashboard.</p>
      
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary">Email address</label>
          <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" />
          <small id="emailError" class="text-danger mt-1 d-block"></small>
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold text-secondary">Password</label>
          <input type="password" class="form-control" id="floatingPassword" placeholder="••••••••" />
          <small id="passwordError" class="text-danger mt-1 d-block"></small>
        </div>
        <div class="text-end mb-4">
          <a href="./forgotpassword.html" class="text-primary text-decoration-none fw-semibold small">Forgot password?</a>
        </div>
        <button class="btn btn-primary w-100 mb-4" type="submit">Sign In</button>
      </form>

      <p class="text-center text-secondary fw-medium">
        Don't have an account? <a href="./register.html" class="text-primary text-decoration-none fw-bold">Sign up</a>
      </p>
    </div>
  </div>
  <div class="right-container col-md-7 d-none d-md-flex justify-content-center align-items-center m-0 p-0 text-white">
    <div class="text-center position-relative z-1">
      <h1 class="display-3 fw-bold mb-4">Shape the Future</h1>
      <p class="fs-4 fw-light opacity-75">Share feedback on products you love.</p>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script/index.js?v=2"></script>
</body>
</html>
