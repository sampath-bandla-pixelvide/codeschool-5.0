<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Feedback Password Recovery</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #6366f1;
      --dark: #0f172a;
      --font-family: 'Outfit', sans-serif;
    }
    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
      color: var(--dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .recovery-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
    }
    .form-control {
      background: #f1f5f9;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 12px 15px;
      transition: all 0.3s;
    }
    .form-control:focus {
      background: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }
    .icon-box {
      width: 80px;
      height: 80px;
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      margin: 0 auto 20px;
    }
  </style>
</head>
<body>
  <div class="recovery-card text-center">
    <div class="icon-box">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h2 class="fw-bold mb-2">Password Recovery</h2>
    <p class="text-secondary mb-4">We'll help you get back into your account securely.</p>
    
    <!-- Step 1: Email -->
    <form id="verifyEmail" class="text-start">
      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary">Email address</label>
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" />
      </div>
      <button class="btn btn-primary w-100" type="submit">Send Verification Code</button>
    </form>

    <!-- Step 2: OTP -->
    <form id="verifyOtp" class="d-none text-start">
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary">Email address</label>
        <input type="email" class="form-control text-muted" id="email" disabled />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary">Verification Code</label>
        <input type="text" class="form-control text-center fs-4 letter-spacing-2" id="otpp" placeholder="000000" />
        <small id="otp" class="mt-1 text-danger d-block"></small>
      </div>
      <button class="btn btn-primary w-100 mb-2" type="submit">Verify Code</button>
      <button class="btn btn-outline-secondary w-100" id="resendOtp" type="button">Resend Code</button>
    </form>

    <!-- Step 3: New Password -->
    <form id="setPassword" class="d-none text-start">
      <div class="mb-3 d-none">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="eemail" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary">New Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary">Confirm New Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary w-100" type="submit">Reset Password</button>
    </form>

    <div class="mt-4">
      <a href="./index.html" class="text-secondary text-decoration-none fw-medium"><i class="bi bi-arrow-left me-1"></i> Back to login</a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script/forgotpassword.js"></script>
</body>
</html>
