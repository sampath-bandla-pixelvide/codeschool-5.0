<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback - Register</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/styles/register.css" />
  </head>
  <body class="row g-0 p-0 m-0 min-vh-100">
    <div
      class="left-container col-md-5 d-none d-md-flex justify-content-center align-items-center m-0 p-0 text-white"
    >
      <div class="text-center position-relative z-1 p-5">
        <div class="display-1 mb-4">
          <i class="bi bi-person-lines-fill"></i>
        </div>
        <p class="fs-5 fw-light opacity-75">
          Create an account to start sharing your feedback and shaping product
          development.
        </p>
      </div>
    </div>
    <div
      class="right-container d-flex flex-column align-items-center p-4 p-md-5 col-12 col-md-7 min-vh-100"
    >
      <div class="w-100 my-auto py-4" style="max-width: 500px">
        <h2 class="fw-bold mb-2">Create Account</h2>
        <p class="text-secondary mb-4">
          Fill in your details below to get started.
        </p>

        <form id="registerForm">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary"
                >First Name</label
              >
              <input
                type="text"
                class="form-control"
                id="firstName"
                placeholder="John"
              />
              <small id="fnameError" class="text-danger"></small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary"
                >Last Name</label
              >
              <input
                type="text"
                class="form-control"
                id="lastName"
                placeholder="Doe"
              />
              <small id="lnameError" class="text-danger"></small>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary"
              >Email address</label
            >
            <input
              type="email"
              class="form-control"
              id="floatingInput"
              placeholder="name@example.com"
            />
            <small id="emailError" class="text-danger"></small>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary"
                >Date of Birth</label
              >
              <input type="date" class="form-control" id="dob" />
              <small id="dobError" class="text-danger"></small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary"
                >Phone Number</label
              >
              <input
                type="text"
                class="form-control"
                id="phone"
                placeholder="9876543210"
                maxlength="10"
              />
              <small id="phoneError" class="text-danger"></small>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary"
                >Password</label
              >
              <input
                type="password"
                class="form-control"
                id="floatingPassword"
                placeholder="••••••••"
              />
              <small id="passwordError" class="text-danger"></small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary"
                >Confirm Password</label
              >
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="••••••••"
              />
              <small id="confirmPasswordError" class="text-danger"></small>
            </div>
          </div>

          <button class="btn btn-primary w-100 mb-4" type="submit">
            Register Now
          </button>
        </form>

        <p class="text-center text-secondary fw-medium">
          Already have an account?
          <a
            href="./index.html"
            class="text-primary text-decoration-none fw-bold"
            >Sign in</a
          >
        </p>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script/resgister.js?v=2"></script>
  </body>
</html>
