<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBook — Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet" />
    <style>
      .profile-hover:hover { background: rgba(233,69,96,0.1); color: var(--mb-text)!important; }
      @media (max-width: 576px) {
        .hero-title { font-size: 2rem; }
        .hero-section { padding: 40px 0; }
        .movie-filters { flex-direction: column; align-items: stretch !important; gap: 10px; }
        .movie-filters .d-flex { flex-wrap: wrap; justify-content: center; }
      }
      :root {
        --mb-bg: #0f0f1a;
        --mb-surface: #1a1a2e;
        --mb-surface2: #16213e;
        --mb-accent: #e94560;
        --mb-accent-hover: #c73652;
        --mb-gold: #f5a623;
        --mb-text: #e2e8f0;
        --mb-muted: #94a3b8;
        --mb-success: #22c55e;
        --mb-border: rgba(255,255,255,0.07);
      }
      * { box-sizing: border-box; }
      body {
        background-color: var(--mb-bg);
        color: var(--mb-text);
        font-family: 'DM Sans', system-ui, sans-serif;
        min-height: 100vh;
      }
      .navbar-cb {
        background: rgba(15, 15, 26, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--mb-border);
        padding: 14px 0;
      }
      .navbar-brand-cb {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--mb-text) !important;
        text-decoration: none;
      }
      .navbar-brand-cb span { color: var(--mb-accent); }
      .btn-nav-outline {
        border: 1.5px solid var(--mb-border);
        color: var(--mb-muted);
        background: transparent;
        border-radius: 8px;
        padding: 6px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-nav-outline:hover {
        border-color: var(--mb-accent);
        color: var(--mb-accent);
      }
      .btn-nav-accent {
        background: var(--mb-accent);
        color: #fff !important;
        border: none;
        border-radius: 8px;
        padding: 6px 16px;
        font-size: 0.875rem;
        font-weight: 600;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-nav-accent:hover { background: var(--mb-accent-hover); }
      .hero-section {
        background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 40%, #16213e 100%);
        padding: 70px 0 50px;
        position: relative;
        overflow: hidden;
      }
      .hero-section::before {
        content: '';
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(233,69,96,0.12) 0%, transparent 70%);
        top: -200px;
        right: -100px;
        border-radius: 50%;
      }
      .hero-title {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -1.5px;
        line-height: 1.1;
      }
      .hero-title span { color: var(--mb-accent); }
      .hero-sub {
        color: var(--mb-muted);
        font-size: 1.05rem;
        max-width: 480px;
      }
      .search-bar {
        background: var(--mb-surface);
        border: 1.5px solid var(--mb-border);
        border-radius: 12px;
        padding: 10px 18px;
        color: var(--mb-text);
        font-size: 0.95rem;
        width: 100%;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-bar::placeholder { color: var(--mb-muted); }
      .search-bar:focus { border-color: var(--mb-accent); }
      .genre-pill {
        background: var(--mb-surface);
        border: 1.5px solid var(--mb-border);
        color: var(--mb-muted);
        border-radius: 50px;
        padding: 6px 18px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        user-select: none;
      }
      .genre-pill:hover, .genre-pill.active {
        background: var(--mb-accent);
        border-color: var(--mb-accent);
        color: #fff;
      }
      .movie-card {
        background: var(--mb-surface);
        border: 1px solid var(--mb-border);
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        cursor: pointer;
        height: 100%;
      }
      .movie-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 60px rgba(233, 69, 96, 0.18);
        border-color: var(--mb-accent);
      }
      .movie-poster-wrap {
        position: relative;
        overflow: hidden;
        height: 280px;
      }
      .movie-poster {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }
      .movie-card:hover .movie-poster { transform: scale(1.05); }
      .poster-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(15,15,26,0.95) 0%, transparent 60%);
      }
      .rating-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(245, 166, 35, 0.95);
        color: #1a1a2e;
        font-size: 0.78rem;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .genre-tag {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(233, 69, 96, 0.9);
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .card-body-cb {
        padding: 16px;
      }
      .movie-title-cb {
        font-size: 1rem;
        font-weight: 700;
        color: var(--mb-text);
        margin: 0 0 6px;
        line-height: 1.3;
        display: -webkit-box;
        /* -webkit-line-clamp: 2; */
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .movie-meta {
        font-size: 0.8rem;
        color: var(--mb-muted);
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .btn-book {
        background: var(--mb-accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 9px 0;
        font-size: 0.875rem;
        font-weight: 700;
        width: 100%;
        transition: background 0.2s, transform 0.15s;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-book:hover {
        background: var(--mb-accent-hover);
        transform: translateY(-1px);
      }
      .section-header {
        padding: 40px 0 24px;
      }
      .section-title {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .section-count {
        font-size: 0.85rem;
        color: var(--mb-muted);
        margin-left: 10px;
      }
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--mb-muted);
      }
      .empty-state i { font-size: 3.5rem; margin-bottom: 16px; opacity: 0.4; }
      .empty-state p { font-size: 1.05rem; }
      .skeleton {
        background: linear-gradient(90deg, var(--mb-surface) 25%, #1f2340 50%, var(--mb-surface) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 12px;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .skeleton-poster { height: 280px; width: 100%; border-radius: 12px 12px 0 0; }
      .skeleton-line { height: 14px; margin: 8px 0; }
      .skeleton-line.short { width: 60%; }
      .skeleton-btn { height: 38px; margin-top: 14px; border-radius: 10px; }
      .footer-cb {
        border-top: 1px solid var(--mb-border);
        padding: 28px 0;
        text-align: center;
        color: var(--mb-muted);
        font-size: 0.83rem;
        margin-top: 60px;
      }
      @media (max-width: 576px) {
        .hero-section { padding: 50px 0 36px; }
        .genre-pills-wrap { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
      }
    </style>
  </head>
  <body>
    <nav class="navbar-cb sticky-top">
      <div class="container d-flex align-items-center justify-content-between gap-2">
        <a href="./movies.html" class="navbar-brand-cb">Cine<span>Book</span></a>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <a href="./my_bookings.html" class="btn-nav-outline" id="myBookingsLink" style="display:none;">
            <i class="bi bi-ticket-perforated"></i> My Bookings
          </a>
          <a href="./admin.html" class="btn-nav-outline" id="adminLink" style="display:none;">
            <i class="bi bi-shield-check"></i> Admin
          </a>
          <a href="./index.html" class="btn-nav-outline" id="loginLink">
            <i class="bi bi-person"></i> Login
          </a>
          <div class="dropdown" id="profileDropdownWrap" style="display:none;z-index:100;">
            <button class="btn btn-link text-white text-decoration-none dropdown-toggle p-0 d-flex align-items-center gap-2" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle" id="headerProfileIcon" style="font-size: 1.4rem; color: var(--mb-muted);"></i>
              <img src="" id="headerProfileImg" style="width:32px;height:32px;border-radius:50%;object-fit:cover;display:none;border:1px solid var(--mb-border);">
              <span id="welcomeMsg" class="fw-bold d-none d-md-inline"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="profileDropdown" style="background:var(--mb-surface); border:1px solid var(--mb-border);">
              <li><a class="dropdown-item text-white profile-hover" href="#" id="openProfileModal"><i class="bi bi-person-vcard me-2"></i>Profile Details</a></li>
              <li><a class="dropdown-item text-white profile-hover" href="#" id="openPasswordModal"><i class="bi bi-shield-lock me-2"></i>Change Password</a></li>
              <li><hr class="dropdown-divider" style="border-color:var(--mb-border);"></li>
              <li><a class="dropdown-item text-danger profile-hover" href="#" id="logoutBtnDropdown"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <section class="hero-section">
      <div class="container">
        <h1 class="hero-title">Book Your<br><span>Perfect Show</span></h1>
        <p class="hero-sub mt-3 mb-4">Discover movies, choose your seats, and book tickets in seconds.</p>
        <div class="row g-2 align-items-center" style="max-width:520px;">
          <div class="col">
            <div style="position:relative;">
              <i class="bi bi-search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mb-muted);font-size:0.9rem;"></i>
              <input type="text" id="searchInput" class="search-bar" placeholder="Search movies…" style="padding-left:38px;" />
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="container mt-4">
      <div class="d-flex align-items-center gap-2 genre-pills-wrap flex-wrap" id="genrePills">
        <span class="genre-pill active" data-genre="">All</span>
      </div>
    </div>
    <div class="container">
      <div class="section-header d-flex align-items-baseline">
        <span class="section-title">Now Showing</span>
        <span class="section-count" id="movieCount"></span>
      </div>
      <div class="row g-4" id="moviesGrid">
        <div class="col-6 col-md-4 col-lg-3 skeleton-card">
          <div class="movie-card"><div class="skeleton skeleton-poster"></div><div class="card-body-cb"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-btn"></div></div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-3 skeleton-card">
          <div class="movie-card"><div class="skeleton skeleton-poster"></div><div class="card-body-cb"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-btn"></div></div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-3 skeleton-card">
          <div class="movie-card"><div class="skeleton skeleton-poster"></div><div class="card-body-cb"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-btn"></div></div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-3 skeleton-card">
          <div class="movie-card"><div class="skeleton skeleton-poster"></div><div class="card-body-cb"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-btn"></div></div></div>
        </div>
      </div>
    </div>
    <footer class="footer-cb">
      <div class="container">
        <span>© 2026 CineBook &nbsp;·&nbsp; Book smarter, watch better.</span>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./scripts/movies.js"></script>
    <script src="./scripts/profile.js"></script>
    
  </body>
</html>
