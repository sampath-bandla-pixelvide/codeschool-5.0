<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBook — My Bookings</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap"
      rel="stylesheet"
    />
    <style>
      .profile-hover:hover {
        background: rgba(233, 69, 96, 0.1);
        color: var(--mb-text) !important;
      }
      :root {
        --mb-bg: #0f0f1a;
        --mb-surface: #1a1a2e;
        --mb-accent: #e94560;
        --mb-accent-hover: #c73652;
        --mb-gold: #f5a623;
        --mb-text: #e2e8f0;
        --mb-muted: #94a3b8;
        --mb-success: #22c55e;
        --mb-border: rgba(255, 255, 255, 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--mb-bg);
        color: var(--mb-text);
        font-family: "DM Sans", system-ui, sans-serif;
        min-height: 100vh;
      }
      .navbar-cb {
        background: rgba(15, 15, 26, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--mb-border);
        padding: 14px 0;
      }
      .navbar-brand-cb {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--mb-text) !important;
        text-decoration: none;
      }
      .navbar-brand-cb span {
        color: var(--mb-accent);
      }
      .btn-nav-outline {
        border: 1.5px solid var(--mb-border);
        color: var(--mb-muted);
        background: transparent;
        border-radius: 8px;
        padding: 6px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-nav-outline:hover {
        border-color: var(--mb-accent);
        color: var(--mb-accent);
      }
      .btn-nav-accent {
        background: var(--mb-accent);
        color: #fff !important;
        border: none;
        border-radius: 8px;
        padding: 6px 16px;
        font-size: 0.875rem;
        font-weight: 600;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .btn-nav-accent:hover {
        background: var(--mb-accent-hover);
      }
      .page-header {
        padding: 48px 0 32px;
      }
      .page-title {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .page-title span {
        color: var(--mb-accent);
      }
      .booking-card {
        background: var(--mb-surface);
        border: 1px solid var(--mb-border);
        border-radius: 16px;
        overflow: hidden;
        transition:
          transform 0.22s,
          box-shadow 0.22s;
        margin-bottom: 20px;
      }
      .booking-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }
      .booking-card-inner {
        display: flex;
      }
      .booking-poster {
        width: 100px;
        flex-shrink: 0;
        object-fit: cover;
      }
      .booking-info {
        padding: 18px 20px;
        flex: 1;
      }
      .booking-title {
        font-size: 1.05rem;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .booking-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 10px;
      }
      .meta-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.8rem;
        color: var(--mb-muted);
      }
      .booking-ref {
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        color: var(--mb-accent);
        font-weight: 700;
        background: rgba(233, 69, 96, 0.1);
        border: 1px dashed rgba(233, 69, 96, 0.3);
        padding: 4px 12px;
        border-radius: 6px;
        display: inline-block;
        margin-bottom: 6px;
      }
      .booking-seats {
        font-size: 0.8rem;
        color: var(--mb-muted);
      }
      .booking-seats strong {
        color: var(--mb-text);
      }
      .booking-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        border-top: 1px solid var(--mb-border);
        background: rgba(0, 0, 0, 0.15);
      }
      .status-confirmed {
        background: rgba(34, 197, 94, 0.15);
        color: var(--mb-success);
        border-radius: 50px;
        padding: 3px 12px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .status-cancelled {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border-radius: 50px;
        padding: 3px 12px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .booking-amount {
        font-size: 1rem;
        font-weight: 800;
        color: var(--mb-gold);
      }
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--mb-muted);
      }
      .empty-state i {
        font-size: 3.5rem;
        margin-bottom: 16px;
        display: block;
        opacity: 0.35;
      }
      .cb-loading {
        text-align: center;
        padding: 60px;
        color: var(--mb-muted);
      }
      .cb-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--mb-border);
        border-top-color: var(--mb-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 576px) {
        .booking-poster {
          width: 80px;
        }
        .booking-info {
          padding: 14px 14px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar-cb sticky-top">
      <div
        class="container d-flex align-items-center justify-content-between gap-2"
      >
        <a href="./movies.html" class="navbar-brand-cb"
          >Cine<span>Book</span></a
        >
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <a href="./movies.html" class="btn-nav-outline"
            ><i class="bi bi-film"></i> Movies</a
          >
          <div class="dropdown" id="profileDropdownWrap" style="display: none">
            <button
              class="btn btn-link text-white text-decoration-none dropdown-toggle p-0 d-flex align-items-center gap-2"
              type="button"
              id="profileDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i
                class="bi bi-person-circle"
                id="headerProfileIcon"
                style="font-size: 1.4rem; color: var(--mb-muted)"
              ></i>
              <img
                src=""
                id="headerProfileImg"
                style="
                  width: 32px;
                  height: 32px;
                  border-radius: 50%;
                  object-fit: cover;
                  display: none;
                  border: 1px solid var(--mb-border);
                "
              />
              <span id="welcomeMsg" class="fw-bold d-none d-md-inline"></span>
            </button>
            <ul
              class="dropdown-menu dropdown-menu-end shadow-sm"
              aria-labelledby="profileDropdown"
              style="
                background: var(--mb-surface);
                border: 1px solid var(--mb-border);
              "
            >
              <li>
                <a
                  class="dropdown-item text-white profile-hover"
                  href="#"
                  id="openProfileModal"
                  ><i class="bi bi-person-vcard me-2"></i>Profile Details</a
                >
              </li>
              <li>
                <a
                  class="dropdown-item text-white profile-hover"
                  href="#"
                  id="openPasswordModal"
                  ><i class="bi bi-shield-lock me-2"></i>Change Password</a
                >
              </li>
              <li>
                <hr
                  class="dropdown-divider"
                  style="border-color: var(--mb-border)"
                />
              </li>
              <li>
                <a
                  class="dropdown-item text-danger profile-hover"
                  href="#"
                  id="logoutBtnDropdown"
                  ><i class="bi bi-box-arrow-right me-2"></i>Logout</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">My <span>Bookings</span></h1>
        <p style="color: var(--mb-muted)">
          All your ticket bookings in one place.
        </p>
      </div>
      <div id="bookingsList">
        <div class="cb-loading">
          <div class="cb-spinner"></div>
          <p>Loading your bookings…</p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./scripts/my_bookings.js"></script>
    <script src="./scripts/profile.js"></script>
  </body>
</html>
