  </div>

  <div class="px-3 py-2">
    <small class="text-uppercase text-white-50 sideRoleLabel"

  </div>

  <div class="offcanvas-body p-0 d-flex flex-column">

    <ul class="nav flex-column px-2">

      <li class="nav-item">
        <a class="nav-link sidebar-link text-white rounded px-3 py-2 mb-1 active"

      <li class="nav-item admin-link">
