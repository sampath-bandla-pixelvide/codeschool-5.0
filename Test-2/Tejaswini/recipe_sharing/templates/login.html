<div class="col-md-6 col-lg-5" id="loginContainer">
  <div class="card border-0 login-card">
    <div class="card-body p-2 p-lg-5">
      <div class="text-center mb-2">
        <div class="lock-icon mx-auto mb-3">
          <i class="bi bi-shield-lock fs-3"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">Welcome back</h2>
        <p class="login-subtitle mb-0">Please sign in to continue</p>
      </div>

      <div class="mb-3">
        <label class="form-label text-dark" for="emailInput">Email</label>
        <div class="input-group custom-input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>
          <input
            type="email"
            id="emailInput"
            class="form-control"
            placeholder="user@gmail.com"
          />
        </div>
        <small class="text-danger d-none" id="emailInputError"
          >Invalid email</small
        >
      </div>

      <div class="mb-3">
        <label class="form-label text-dark" for="passwordInput">Password</label>
        <div class="input-group custom-input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input
            type="password"
            id="passwordInput"
            class="form-control"
            placeholder="••••••••"
          />
        </div>
        <small class="text-danger d-none" id="passwordInputError"
          >Invalid Password</small
        >
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label text-dark small" for="remember">
            Remember me
          </label>
        </div>

        <span id="forgotPasswordLink">Forgot password?</span>
      </div>
      <button class="btn login-btn w-100" id="loginBtn">
        Sign in
      </button>

      <p class="text-center mt-3 mb-0 login-footer">
        Don't have an account?
        <span id="registerLink">Register</span>
      </p>
    </div>
  </div>
</div>
