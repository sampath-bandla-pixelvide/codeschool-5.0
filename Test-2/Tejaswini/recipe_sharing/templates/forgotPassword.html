<div class="col-md-6 col-lg-4" id="verifyEmail">
  <div class="card login-card border-0">
    <div class="card-body p-4 p-lg-5">
      <div class="d-flex justify-content-between align-items-start mb-4">
        <div class="d-flex align-items-start gap-3">
          <div class="lock-icon flex-shrink-0">
            <i class="bi bi-shield-check"></i>
          </div>

          <div class="pt-1">
            <h2 class="fw-bold text-dark mb-1">Verify Email</h2>

            <p class="login-subtitle mb-0">Enter your email to receive OTP</p>
          </div>
        </div>
        <button class="btn close-btn" id="cancleVerifyEmail">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="mb-3">
        <label class="form-label text-dark"> Email address </label>

        <div class="input-group custom-input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>

          <input
            type="email"
            id="validateEmailInput"
            class="form-control"
            placeholder="user@gmail.com"
          />

          <button class="btn otp-btn" id="getOTPbtn">Get OTP</button>
        </div>

        <small class="text-danger d-none" id="validateEmailInputError">
          Invalid email
        </small>
      </div>

      <div class="text-end mb-1 d-none" id="changeEmailContainer">
        <span id="changeEmailBtn"> Change email </span>
      </div>

      <div class="mb-4 d-none" id="otpInputField">
        <label class="form-label text-light"> Enter OTP </label>

        <div class="input-group custom-input-group">
          <span class="input-group-text">
            <i class="bi bi-key fs-4"></i>
          </span>

          <input
            type="text"
            id="otpInput"
            class="form-control"
            maxlength="6"
            placeholder="XXX-XXX"
          />
        </div>

        <small class="text-danger d-none" id="otpInputFieldError">
          Invalid OTP
        </small>

        <div class="d-flex justify-content-between align-items-center mt-2">
          <small class="text-secondary" id="timerText"></small>

          <small id="resendOtp" class="hover-link"> Resend OTP </small>
        </div>
      </div>

      <button class="btn login-btn w-100" id="verifyBtn" disabled>
        Verify
      </button>
    </div>
  </div>
</div>
