<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
 <div class="container-fluid bg-light">
    <div class="row justify-content-center align-items-center min-vh-100">
          <div class="col-lg-10">
             <div class="card rounded-1 shadow-lg border-0 overflow-hidden" id="mainContent">
                <div class="row g-0">
                <div class="col-md-6 overlay-section text-white p-5 d-flex justify-content-center align-items-center" id="left-panel">
                    <div id="signup-info">
                        <p class="fs-5">Create you account easily.</p>
                        <button class="btn btn-danger px-4" id="showSignup">
                    SIGN UP
                  </button>
                    </div>
                        <form onsubmit="register();return false;" id="signupForm" class="d-none w-100">
                            <h2 class="text-center mb-4">Sign Up</h2>
                              <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          class="form-control"
                          id="firstName"
                          placeholder="First Name"
                        />
                        <label for="firstName"
                          ><i class="bi bi-person me-2"></i>First Name</label
                        >
                      </div>
                      <p id="firstNameError" class="text-danger"></p>
                    </div>
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          class="form-control"
                          id="lastName"
                          placeholder="Last Name"
                        />
                        <label for="lastName"
                          ><i class="bi bi-person me-2"></i>Last Name</label
                        >
                      </div>
                      <p id="lastNameError" class="text-danger"></p>
                    </div>
                </div>
                 <div class="form-floating mb-3">
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="name@example.com"
                    />
                    <label for="email"
                      ><i class="bi bi-envelope me-2"></i>Email address</label
                    >
                  </div>
                  <p id="emailError" class="text-danger"></p>
                  <div class="form-floating mb-3">
                    <input
                      type="tel"
                      class="form-control"
                      id="phone"
                      placeholder="Phone Number"
                      maxlength="10"
                    />
                    <label for="phone"
                      ><i class="bi bi-telephone me-2"></i>Phone Number</label
                    >
                  </div>
                  <p id="phoneError" class="text-danger"></p>
                    
                  <div class="form-floating mb-3">
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Password"
                    />
                    <label for="password"
                      ><i class="bi bi-lock me-2"></i>Password</label
                    >
                  </div>
                  <p id="passwordError" class="text-danger"></p>
                  <div class="form-floating mb-4">
                    <input
                      type="password"
                      class="form-control"
                      id="confirmPassword"
                      placeholder="Confirm Password"
                    />
                    <label for="confirmPassword"
                      ><i class="bi bi-lock-fill me-2"></i>Confirm
                      Password</label
                    >
                  </div>
                  <p id="confirmPasswordError" class="text-danger"></p>
                   <div class="form-check mb-4">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="termsCheck"
                    />
                    <label class="form-check-label" for="termsCheck">
                      I agree to the
                      <a href="#" class="text-decoration-none"
                        >Terms & Conditions</a
                      >
                    </label>
                  </div>
                  <button
                    type="submit"
                    class="btn btn-primary btn-register w-100 mb-3" id="signupBtn"
                  >
                    <i class="bi bi-person-plus me-2"></i>SIGN UP
                  </button>
                        </form>
                </div>
                <div class="col-md-6 bg-light p-5 d-flex justify-content-center align-items-center"id="rightPanel">
                     <form onsubmit="login();return false;" id="loginForm" class="w-100">
                        <h2 class="text-center mb-4">LOGIN</h2>
                         <div class="form-floating mb-3">
                    <input
                      type="email"
                      class="form-control"
                      id="loginEmail"
                      placeholder="name@example.com"
                      required
                    />
                    <label for="email"
                      ><i class="bi bi-envelope me-2"></i>Email address</label
                    >
                  </div>
                  <p id="loginEmailError" class="text-danger"></p>
                   <div class="form-floating mb-4">
                    <input
                      type="password"
                      class="form-control"
                      id="loginPassword"
                      placeholder="Password"
                      required
                    />
                    <label for="loginPassword"
                      ><i class="bi bi-lock me-2"></i>Password</label
                    >
                  </div>
                  <p id="loginPasswordError" class="text-danger"></p>
                   <div
                    class="d-flex justify-content-end align-items-center mb-4"
                  >
                    <a href="./forgotPassword.html" class="text-decoration-none" id="forgotPassword"
                      >Forgot password?</a
                    >
                  </div>
                  <button
                    type="submit"
                    class="btn btn-primary btn-login w-100 mb-3" id="loginBtn"
                  >
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                  </button>
                     </form>
                       <div id="login-info" class="d-none">
                        <p class="fs-5">
                        Already have an account?
                    </p>
                     <button class="btn btn-info px-4" id="showLogin">
                        LOGIN
                    </button>
                       </div>
             </div>
          </div>

    </div>
 </div>
 
    
<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./scripts/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
