<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family:
          "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background-image: url(./styles/assets/index.jpg);
        background-size: cover;
      }
      #resendOtp:hover {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-5" id="verifyEmail">
          <div class="card rounded-4 shadow border-0">
            <div class="card-body p-4">
              <div
                class="d-flex justify-content-between align-items-center mb-1"
              >
                <div class="fs-5 fw-bold">Verify</div>
                <button class="btn btn-sm btn-white" id="cancelVerifyEmail">
                  <i class="bi bi-x fs-4"></i>
                </button>
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <div class="input-group">
                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                  />
                  <button class="btn btn-primary" id="getOTPBtn">
                    Get OTP
                  </button>
                </div>
                <small class="text-danger d-none" id="emailError"
                  >Invalid email! Enter Valid email</small
                >
              </div>
              <div class="mb-3 d-none" id="otpInputField">
                <label class="form-label" for="otpInput">Enter OTP</label>
                <input
                  type="text"
                  id="otpInput"
                  class="form-control"
                  maxlength="6"
                  placeholder="XXX-XXX"
                  required
                />
                <small class="text-danger d-none" id="otpInputFieldError"
                  >Invalid OTP! otp need to be six characters</small
                >
                <small
                  class="text-muted d-flex mt-2 justify-content-end"
                  id="resendOtpContainer"
                  ><span class="mx-2" id="timerText"></span
                  ><span
                    class="hoverEffect text-primary fw-medium"
                    id="resendOtp"
                    >Resend</span
                  ></small
                >
              </div>

              <button class="btn btn-dark w-100" id="verifyBtn" disabled>
                Verify
              </button>

              <div id="passwordResetContainer" class="d-none">
                <div class="mb-3">
                  <label class="form-label" for="newPasswordInput"
                    >New Password</label
                  >
                  <input
                    type="password"
                    id="newPasswordInput"
                    class="form-control"
                    placeholder="Setup New Password"
                    required
                  />
                  <small class="text-danger d-none" id="newPasswordInputError"
                    >Must be in between 6 - 25 characters!!!</small
                  >
                </div>
                <div class="mb-3">
                  <label class="form-label" for="confirmPasswordInput"
                    >Confirm Password</label
                  >
                  <input
                    type="password"
                    id="confirmPasswordInput"
                    class="form-control"
                    placeholder="Confirm Password"
                    required
                  />
                  <small
                    class="text-danger d-none"
                    id="confirmPasswordInputError"
                    >Password Missmatch!!!</small
                  >
                </div>
                <button class="btn btn-primary w-100" id="resetPasswordBtn">
                  Confirm
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <script src="./scripts/forgotPassword.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
