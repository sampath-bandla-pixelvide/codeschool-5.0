<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./styles/home.css">
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div id="header" class="mb-3">
                    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
                        <div class="container">
                            <a class="navbar-brand fw-bold" href="home.html"><i class="bi bi-heart-fill me-2 text-danger"></i>Donation Platform</a>
                            <a class="btn btn-outline-light ms-auto" href="home.html">Back to Campaigns</a>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
        
        <div class="container py-4">
            <div id="campaignDetailsContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Donation Modal -->
    <div class="modal fade" id="donationModal" tabindex="-1" aria-labelledby="donationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title" id="donationModalLabel">Make a Donation</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="donationForm">
                        <input type="hidden" id="donateCampaignId">
                        <div class="mb-3">
                            <label for="donorName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="donorName" required>
                        </div>
                        <div class="mb-3">
                            <label for="donorMobile" class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control" id="donorMobile" required pattern="[0-9]{10}" title="10 digit mobile number">
                        </div>
                        <div class="mb-3">
                            <label for="donationAmount" class="form-label">Donation Amount ($)</label>
                            <input type="number" class="form-control" id="donationAmount" required min="1" step="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block">Payment Method</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="payUpi" value="UPI" required>
                                <label class="form-check-label" for="payUpi">UPI</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="payCard" value="Credit Card" required>
                                <label class="form-check-label" for="payCard">Credit Card</label>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="paymentId" class="form-label">Payment ID</label>
                            <input type="text" class="form-control" id="paymentId" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="donateSubmitBtn">
                            <i class="bi bi-heart-fill me-2"></i>Donate Now
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./scripts/campaignDetails.js"></script>
</body>
</html>
