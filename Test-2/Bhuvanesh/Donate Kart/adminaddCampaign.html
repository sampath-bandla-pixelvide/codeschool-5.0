<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Campaign - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body class="bg-light">
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
              <div id="adminNav"></div>
            </div>
        </div>
        
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                            <h3 class="fw-bold text-primary">Create New Campaign</h3>
                            <a href="adminDashboard.html" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
                        </div>
                        <div class="card-body p-4">
                            <form id="addCampaignForm">
                                <div class="mb-3">
                                    <label for="campaignTitle" class="form-label fw-bold">Campaign Title</label>
                                    <input type="text" class="form-control" id="campaignTitle" required placeholder="Enter an inspiring title">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="campaignTarget" class="form-label fw-bold">Target Amount ($)</label>
                                    <input type="number" class="form-control" id="campaignTarget" required min="1" step="0.01" placeholder="10000">
                                </div>
                                
                                <div class="mb-4">
                                    <label for="campaignDescription" class="form-label fw-bold">Campaign Description</label>
                                    <textarea class="form-control" id="campaignDescription" rows="6" required placeholder="Describe the purpose of this campaign..."></textarea>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitCampaignBtn">
                                    <i class="bi bi-plus-circle me-2"></i>Create Campaign
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./scripts/loader.js"></script>
<script src="./scripts/adminAddCampaign.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
