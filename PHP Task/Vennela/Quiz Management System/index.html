<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz Manager Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        height: 100vh;
      }
      .login-card {
        max-width: 420px;
        width: 100%;
      }
      .logo-box {
        width: 60px;
        height: 60px;
        background-color: rgb(50, 229, 191);
      }
      .form-control:focus {
        box-shadow: none !important;
        border-color: grey;
        border-width: 1px;
      }
    </style>
  </head>
  <body class="d-flex justify-content-center align-items-center bg-body">
    <div class="card login-card shadow-lg border-0 rounded-4 p-4">
      <div
        class="logo-box rounded-3 d-flex justify-content-center align-items-center mx-auto mb-3 text-dark"
      >
        <i class="bi bi-mortarboard fs-4"></i>
      </div>
      <h3 class="text-center fw-bold mb-3">Quizzle</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Your name"
          />
          <small id="nameError" class="text-danger"></small>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="you@example.com"
          />
          <small id="emailError" class="text-danger"></small>
        </div>
        <div class="mb-2 d-flex justify-content-between">
          <label for="password" class="form-label">Password</label>
        </div>
        <div class="mb-3">
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="......."
          />
          <small id="passwordError" class="text-danger"></small>
        </div>
        <button
          type="submit"
          id="loginBtn"
          class="btn w-100 text-dark"
          style="background-color: rgb(50, 229, 191)"
        >
          Sign in
        </button>
      </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./scripts/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
