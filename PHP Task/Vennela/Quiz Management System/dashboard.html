<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="dashboard.css" />
  </head>

  <body>
    <div class="sidebar" id="sidebarContainer">
      <h4>Quizzle</h4>
      <a class="nav-link active" data-page="dashboard">
        <i class="bi bi-grid"></i>Dashboard
      </a>

      <a class="nav-link" data-page="quizzes">
        <i class="bi bi-question-diamond"></i>Quizzes
      </a>

      <a class="logout" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i>Logout
      </a>
    </div>

    <div class="content">
      <div id="appContent"></div>

      <h2 class="fw-bold">Welcome back</h2>
      <div class="row g-4 mt-3">
        <div class="col-md-4">
          <div class="card-custom">
            <h6>Subjects</h6>
            <h2 id="subjectCount">0</h2>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card-custom">
            <h6>Total Quizzes</h6>
            <h2 id="quizCount">0</h2>
          </div>
        </div>

        <!-- ✅ Replaced Completed -->
        <div class="col-md-4">
          <div class="card-custom">
            <h6>Total Users</h6>
            <h2 id="userCount">0</h2>
          </div>
        </div>
      </div>

      <!-- Users List -->
      <div class="user-card mt-4">
        <h5 class="mb-3">Users</h5>
        <ul id="userList" class="list-group"></ul>
      </div>

      <!-- Button -->
      <div class="mt-4">
        <button class="btn-green">Go to Quizzes ➜</button>
      </div>
    </div>
    <div class="modal fade" id="quizModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content quiz-modal">
          <!-- HEADER -->
          <div class="quiz-header">
            <div>
              <h4 id="quizTitle"></h4>
              <p class="question-meta">
                Question <span id="qNumber"></span> of <span id="totalQ"></span>
              </p>
            </div>

            <div class="quiz-header-right">
              <span id="timer" class="quiz-timer"></span>
              <button
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>
          </div>

          <!-- PROGRESS BAR -->
          <div class="progress quiz-progress">
            <div class="progress-bar" id="progressBar"></div>
          </div>

          <!-- QUESTION -->
          <div class="quiz-body mt-4">
            <h5 id="questionText"></h5>

            <div id="optionsList" class="mt-4">
              <!-- options injected -->
            </div>
            <div class="d-flex justify-content-start mt-3">
              <button id="submitAnswer" class="btn btn-success" disabled>
                Submit
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="resultModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content result-modal text-center p-4">
          <button
            class="btn-close btn-close-white ms-auto"
            data-bs-dismiss="modal"
          ></button>

          <!-- ICON -->
          <div class="mb-3">
            <i class="bi bi-trophy result-icon"></i>
          </div>

          <!-- TITLE -->
          <h3 class="fw-bold">Quiz Complete!</h3>
          <p>You scored</p>

          <!-- SCORE -->
          <h1 id="finalScore" class="score-text">0/0</h1>

          <!-- ANSWERS -->
          <div id="resultDetails" class="mt-4 text-start"></div>

          <!-- BUTTON -->
          <button class="btn btn-success w-100 mt-4" data-bs-dismiss="modal">
            Done
          </button>
        </div>
      </div>
    </div>
    <div class="modal fade" id="addSubjectModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content subject-modal p-4">
          <!-- HEADER -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0 fw-bold">New Subject</h5>
            <button
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <label class="mb-2">Name</label>
          <input
            type="text"
            id="subjectName"
            class="form-control subject-input"
            placeholder="e.g. Geography"
          />

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button class="btn cancel-btn" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn create-btn" id="saveSubject">Create</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="addQuizModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content subject-modal p-4">
          <!-- HEADER -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold">New Quiz</h5>
            <button
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <label>Title</label>
          <input id="quizTitleInput" class="form-control subject-input mb-3" />

          <div id="questionsContainer"></div>
          <div class="d-flex justify-content-start mt-3">
            <button class="btn add-question-btn">
              <i class="bi bi-plus"></i> Add Question
            </button>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button class="btn cancel-btn" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn create-btn" id="saveQuiz">Create Quiz</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
     <script src="./scripts/functions.js"></script>
    <script src="./scripts/dashboard.js"></script>
  </body>
</html>
