<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard.css" />
    <style>
      .quiz-card,
      .subject-card,
      .card-custom {
        background: #1e293b;
        border-radius: 15px;
        color: white;
        transition: 0.3s;
      }

      .quiz-card,
      .subject-card {
        border: 1px solid transparent;
        transition: 0.3s;
      }

      .quiz-card:hover,
      .subject-card:hover {
        transform: translateY(-5px);
        border-color: #34d399;
      }

      .card-custom {
        padding: 20px;
        text-align: center;
        position: relative;
        padding-bottom: 45px;
      }
      .start-btn {
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid #34d399;
        background: transparent;
        color: #34d399;
        font-size: 13px;
        cursor: pointer;
      }

      .start-btn:hover {
        background: #34d399;
        color: #000;
      }
      .option {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #334155;
        margin-top: 10px;
        cursor: pointer;
        transition: 0.3s;
      }

      .option:hover {
        border-color: #34d399;
        background: rgba(52, 211, 153, 0.1);
      }

      .option.active {
        background: #34d399;
        color: #022c22;
        border-color: #34d399;
      }
    </style>
  </head>

  <body>
    <div id="sidebarContainer"></div>

    <div class="content">
      <div id="dashboardSection">
        <h2 class="fw-bold">Welcome, <span id="userName"></span> 👋</h2>
        <p>Start a quiz and test your knowledge.</p>

        <div class="row g-4 mt-3">
          <div class="col-md-4">
            <div class="card-custom">
              <h6>Total Quizzes</h6>
              <h2 id="quizCount">0</h2>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card-custom">
              <h6>Attempted</h6>
              <h2 id="attemptedCount">0</h2>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card-custom">
              <h6>Average Score</h6>
              <h2 id="avgScore">0%</h2>
            </div>
          </div>
        </div>

        <div class="mt-5">
          <h4 class="fw-bold">Attempted Quizzes</h4>

          <table class="table table-dark mt-3">
            <thead>
              <tr>
                <th>Quiz</th>
                <th>Score</th>
                <th>Subject</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="attemptedTable"></tbody>
          </table>
        </div>
      </div>

      <div id="quizMainSection" class="d-none">
        <div class="mt-4">
          <h4 class="fw-bold">Subjects</h4>
          <div id="subjectContainer" class="row g-4 mt-2"></div>
        </div>

        <div class="mt-5 d-none" id="quizSection">
          <h4 id="selectedSubjectTitle"></h4>
          <div id="quizContainer" class="row g-4 mt-2"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="quizModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content quiz-modal">
          <div class="quiz-header">
            <div>
              <h4 id="quizTitle"></h4>
              <p class="question-meta">
                Question <span id="qNumber"></span> of <span id="totalQ"></span>
              </p>
            </div>
            <div class="quiz-header-right">
              <span id="timer" class="quiz-timer"></span>
              <button
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>
          </div>

          <div class="progress quiz-progress">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="quiz-body mt-4">
            <h5 id="questionText"></h5>

            <div id="optionsList" class="mt-4">
            </div>
            <div class="d-flex justify-content-start mt-3">
              <button id="submitAnswer" class="btn btn-success" disabled>
                Submit
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="resultModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content result-modal text-center p-4">
          <button
            class="btn-close btn-close-white ms-auto"
            data-bs-dismiss="modal"
          ></button>
          <div class="mb-3">
            <i class="bi bi-trophy result-icon"></i>
          </div>
          <h3 class="fw-bold">Quiz Complete!</h3>
          <p>You scored</p>
          <h1 id="finalScore" class="score-text">0/0</h1>
          <div id="resultDetails" class="mt-4 text-start"></div>
          <button class="btn btn-success w-100 mt-4" data-bs-dismiss="modal">
            Done
          </button>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/functions.js"></script>
    <script src="scripts/user-dashboard.js"></script>
  </body>
</html>
