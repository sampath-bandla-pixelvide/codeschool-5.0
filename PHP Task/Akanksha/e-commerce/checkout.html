<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <nav class="sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-hexagon-fill me-2"></i>MyApp
      </div>
      <ul class="nav flex-column mt-3">
        <li class="nav-item">
          <a class="nav-link active" href="user_dashboard.html">
            <i class="bi bi-speedometer2"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="user_dashboard.html">
            <i class="bi bi-box"></i>Products
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="user_orders.html">
            <i class="bi bi-cart3"></i>Orders
          </a>
        </li>

        <div class="sidebar-divider"></div>
        <div class="sidebar-heading">Settings</div>

        <li class="nav-item">
          <a class="nav-link" href="#"> <i class="bi bi-gear"></i>Settings </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            <i class="bi bi-question-circle"></i>Help
          </a>
        </li>
      </ul>
    </nav>

    <header class="header">
      <div class="d-flex align-items-center">
        <button
          class="btn btn-link text-dark d-md-none me-3"
          id="sidebarToggle"
        >
          <i class="bi bi-list fs-4"></i>
        </button>
        <div class="position-relative search-box d-none d-md-block">
          <i class="bi bi-search search-icon"></i>
          <input type="text" class="form-control" placeholder="Search..." />
        </div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <!-- Notifications -->
        <div class="dropdown">
          <button
            class="btn btn-link text-dark position-relative"
            data-bs-toggle="dropdown"
          >
            <i class="bi bi-bell fs-5"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              3
            </span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header">Notifications</h6></li>
            <li><a class="dropdown-item" href="#">New order received</a></li>
            <li><a class="dropdown-item" href="#">User registration</a></li>
            <li><a class="dropdown-item" href="#">Payment confirmed</a></li>
          </ul>
        </div>

        <!-- Profile Dropdown -->
        <div class="dropdown profile-dropdown">
          <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown">
            <div
              id="userAvatar"
              class="rounded-circle text-white d-flex align-items-center justify-content-center"
              style="
                width: 40px;
                height: 40px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              "
            ></div>

            <div class="d-none d-md-block">
              <div class="fw-semibold mt-3" id="userName"></div>
              <p class="" id="role"></p>
            </div>
            <i class="bi bi-chevron-down ms-2"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <div class="dropdown-header text-center">
                <h6 class="mb-0" id="userNameDropdown"></h6>
                <small id="userEmail"></small>
              </div>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" href="#">
                <i class="bi bi-person"></i>My Profile
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="#">
                <i class="bi bi-gear"></i>Settings
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="#">
                <i class="bi bi-activity"></i>Activity Log
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li id="logout">
              <a class="dropdown-item text-danger">
                <i class="bi bi-box-arrow-right"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <div class="container" style="margin-left: 280px; margin-top: 80px">
      <h3>Checkout</h3>

      <div class="mt-4">
        <h5>Order Summary</h5>

        <div id="checkoutItems"></div>

        <div class="text-end mt-2">
          <h5>Total: ₹<span id="checkoutTotal"></span></h5>
        </div>
      </div>

      <div class="mb-3">
        <label class="fw-bold">Delivery Address</label>

        <div id="addressList" class="mt-2"></div>

        <button
          class="btn btn-outline-primary mt-2"
          data-bs-toggle="modal"
          data-bs-target="#addressModal"
        >
          Add Address
        </button>
      </div>

      <div class="mb-3">
        <label>Payment Method</label>
        <select id="payment" class="form-select">
          <option value="cod">Cash on Delivery</option>
          <option value="upi">UPI</option>
          <option value="card">Card</option>
        </select>
      </div>

      <button class="btn btn-primary w-25 mt-3 mb-4" onclick="placeOrder()">
        Place Order
      </button>
    </div>

    <div class="modal fade" id="addressModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Address</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input
              type="text"
              id="address_line"
              class="form-control mb-2"
              placeholder="Address"
            />

            <input
              type="text"
              id="city"
              class="form-control mb-2"
              placeholder="City"
            />

            <input
              type="text"
              id="state"
              class="form-control mb-2"
              placeholder="State"
            />

            <input
              type="text"
              id="country"
              class="form-control mb-2"
              placeholder="Country"
            />

            <input
              type="text"
              id="pincode"
              class="form-control"
              placeholder="Pincode"
            />
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" onclick="saveAddress()">
              Save Address
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script></script>
    <script src="scripts/checkout.js"></script>
  </body>
</html>
