    />

  <body>
    <div id="sidebar"></div>

    <div id="header"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">Dashboard</h4>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
              <a href="#" class="text-decoration-none">Home</a>
            </li>
            <li class="breadcrumb-item active">Dashboard</li>
          </ol>
        </nav>
      </div>

      <!-- Stats Cards -->
      <div class="row g-4 mb-4">
        <div class="col-xl-3 col-md-6">
          <div class="card stat-card primary">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <div class="stat-label text-primary">Total Users</div>
                  <div class="stat-value" id="totalUsers">0</div>
                </div>
                <i class="bi bi-people stat-icon"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="card stat-card success">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <div class="stat-label text-success">Revenue</div>
                  <div class="stat-value" id="revenue">$0</div>
                </div>
                <i class="bi bi-currency-dollar stat-icon"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="card stat-card info">
            <div class="stat-body">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <div class="stat-label text-info">Orders</div>
                    <div class="stat-value" id="orders">0</div>
                  </div>
                  <i class="bi bi-cart stat-icon"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="card stat-card warning">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <div class="stat-label text-warning">Pending</div>
                  <div class="stat-value" id="pending">0</div>
                </div>
                <i class="bi bi-clock stat-icon"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
