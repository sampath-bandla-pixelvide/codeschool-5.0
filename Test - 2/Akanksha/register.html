<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #1f1f1f;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: "Poppins", sans-serif;
      }

      .register-card {
        width: 100%;
        max-width: 900px;
        background: #111111;
        border-radius: 18px;
        padding: 45px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        border: 1px solid #2c2c2c;
      }

      .title {
        text-align: center;
        color: #ffffff;
        font-size: 38px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: #9ca3af;
        margin-bottom: 35px;
        font-size: 14px;
      }

      label {
        color: #d1d5db;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .form-control {
        height: 50px;
        background: #1b1b1b;
        border: 1px solid #2f2f2f;
        border-radius: 10px;
        color: #fff;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .form-control::placeholder {
        color: #6b7280;
      }

      .form-control:focus {
        background: #1b1b1b;
        color: #fff;
        border-color: #525252;
        box-shadow: none;
      }

      .btn-register {
        height: 50px;
        width: 100%;
        background: #e5e7eb;
        color: #111;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn-register:hover {
        background: #d1d5db;
        color: #000;
      }

      .bottom-text {
        text-align: center;
        margin-top: 22px;
        color: #9ca3af;
        font-size: 14px;
      }

      .bottom-text a {
        color: #f3f4f6;
        text-decoration: none;
        font-weight: 600;
      }

      .bottom-text a:hover {
        color: #ffffff;
      }

      small {
        color: #f87171;
      }

      @media (max-width: 768px) {
        .register-card {
          padding: 28px;
        }
        .title {
          font-size: 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="register-card">
      <h1 class="title">Create Account</h1>

      <p class="subtitle">Register to access your dashboard</p>

      <form id="registerForm">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>First Name</label>

              <input
                type="text"
                class="form-control"
                id="firstName"
                placeholder="Enter first name"
              />

              <small id="firstNameErr"></small>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <label>Last Name</label>

              <input
                type="text"
                class="form-control"
                id="lastName"
                placeholder="Enter last name"
              />

              <small id="lastNameErr"></small>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>Email</label>

              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email"
              />

              <small id="emailErr"></small>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <label>Phone</label>

              <input
                type="text"
                class="form-control"
                id="phone_number"
                placeholder="Enter phone number"
              />

              <small id="phoneErr"></small>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>Password</label>

              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password"
              />

              <small id="passwordErr"></small>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <label>Confirm Password</label>

              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="Confirm password"
              />

              <small id="confirmPasswordErr"></small>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-register btn-block mt-3">
          Register
        </button>
      </form>

      <div class="bottom-text">
        Already have an account?
        <a href="index.html">Login</a>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="scripts/register.js"></script>
  </body>
</html>
