<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    \
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #1f1f1f;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: "Poppins", sans-serif;
      }

      .login-card {
        width: 100%;
        max-width: 500px;
        background: #111111;
        border-radius: 18px;
        padding: 45px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        border: 1px solid #2c2c2c;
      }

      .title {
        text-align: center;
        color: #ffffff;
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: #9ca3af;
        margin-bottom: 35px;
        font-size: 14px;
      }

      label {
        color: #d1d5db;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .form-control {
        height: 50px;
        background: #1b1b1b;
        border: 1px solid #2f2f2f;
        border-radius: 10px;
        color: #fff;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .form-control::placeholder {
        color: #6b7280;
      }

      .form-control:focus {
        background: #1b1b1b;
        color: #fff;
        border-color: #525252;
        box-shadow: none;
      }

      .btn-login {
        height: 50px;
        width: 100%;
        background: #e5e7eb;
        color: #111;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn-login:hover {
        background: #d1d5db;
        color: #000;
      }

      .bottom-text {
        text-align: center;
        margin-top: 22px;
        color: #9ca3af;
        font-size: 14px;
      }

      .bottom-text a {
        color: #f3f4f6;
        text-decoration: none;
        font-weight: 600;
      }

      .bottom-text a:hover {
        color: #ffffff;
      }

      .forgot-password {
        text-align: right;
        margin-top: -5px;
        margin-bottom: 20px;
      }

      .forgot-password a {
        color: #9ca3af;
        text-decoration: none;
        font-size: 13px;
      }

      .forgot-password a:hover {
        color: #ffffff;
      }

      small {
        color: #f87171;
      }

      @media (max-width: 576px) {
        .login-card {
          padding: 28px;
        }
        .title {
          font-size: 30px;
        }
      }
    </style>
    
  </head>

  <body>
    <div class="login-card">
      <h1 class="title">Welcome Back</h1>

      <p class="subtitle">Login to continue to your account</p>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
          />

          <small id="emailErr"></small>
        </div>

        <div class="form-group">
          <label>Password</label>

          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
          />

          <small id="passwordErr"></small>
        </div>

        <div class="forgot-password">
          <a href="#"> Forgot Password? </a>
        </div>

        <button type="submit" class="btn btn-login btn-block">Login</button>
      </form>

      <div class="bottom-text">
        Don't have an account?
        <a href="register.html">Register</a>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="scripts/index.js"></script>
  </body>
</html>
