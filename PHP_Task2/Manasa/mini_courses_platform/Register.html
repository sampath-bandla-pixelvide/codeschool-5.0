<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background:
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),
          url("./Images/Register_bg.jpg") no-repeat center center/cover;
        position: relative;
      }

      body::before {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 0;
      }

      .main-wrapper {
        position: relative;
        z-index: 1;
      }

      .branding {
        color: #fff;
        padding: 50px;
      }

      .branding h1 {
        font-weight: 700;
        font-size: 2.5rem;
      }

      .branding p {
        opacity: 0.8;
      }

      .form-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border-radius: 15px;
        padding: 30px;
        color: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .form-control {
        height: 45px;
        border-radius: 8px;
        border: none;
      }

      .form-control:focus {
        box-shadow: 0 0 0 2px #4e73df;
      }

      .btn-primary {
        background: linear-gradient(45deg, #6f42c1, #553396);
        border: none;
        border-radius: 8px;
        font-weight: 500;
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .form-label {
        font-size: 0.9rem;
      }
      a:hover {
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="container-fluid main-wrapper">
      <div class="row min-vh-100">
        <div
          class="branding col-lg-6 d-flex flex-column justify-content-center text-center text-lg-start"
        >
          <h1>SkillBoost 🚀</h1>
          <h3 class="mt-3">Unlock Your Learning Potential</h3>
          <p class="mt-3">
            Learning is a process, not an event. Build your future with skills.
          </p>

          <div class="mt-4">
            <p>✔️ 50+ Courses</p>
            <p>✔️ Track Progress</p>
            <p>✔️ Earn Certificates</p>
          </div>
        </div>

        <div
          class="col-lg-6 d-flex align-items-center justify-content-center p-5"
        >
          <div class="form-card w-100" style="max-width: 500px">
            <h4 class="fw-bold mb-2">Create Account</h4>
            <p class="text-light opacity-75 mb-4">
              Start your learning journey
            </p>

            <form id="registerForm">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Enter your Name"
                    id="name"
                  />
                  <small class="text-danger" id="nameError"></small>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Phone</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Mobile Number"
                    id="phone"
                  />
                  <small class="text-danger" id="phoneError"></small>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="Email Address"
                  id="email"
                />
                <small class="text-danger" id="emailError"></small>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Password"
                    id="password"
                  />
                  <small class="text-danger" id="passwordError"></small>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Confirm Password</label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Confirm Password"
                    id="confirmPassword"
                  />
                  <small class="text-danger" id="confirmPasswordError"></small>
                </div>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terms" />
                <label class="form-check-label">
                  I agree to Terms & Conditions
                </label>
                <small class="text-danger d-block" id="termsError"></small>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2">
                Create Account
              </button>
            </form>

            <div class="text-center mt-3">
              <small>
                Already have an account?
                <a href="./Login.html">Login</a>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./Scripts/register.js"></script>
  </body>
</html>
