<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),
        url("./Login.html") no-repeat center/cover;
      min-height: 100vh;
    }

    .otp-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      padding: 30px;
      color: #fff;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .form-control {
      height: 45px;
      border-radius: 8px;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(45deg, #6f42c1, #553396);
      border: none;
    }
  </style>
</head>

<body>
  <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh">
    <div class="otp-card text-center">
      <h4>Verify OTP</h4>
      <p id="emailText" class="opacity-75"></p>

      <form id="otpForm">
        <input type="text" id="otp" class="form-control mb-3" placeholder="Enter OTP" />
        <small class="text-danger" id="otpError"></small>

        <button type="submit" class="btn btn-primary w-100 mb-2">
          Verify OTP
        </button>
      </form>

      <button id="resendOtp" class="btn btn-outline-light w-100">
        Resend OTP
      </button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./Scripts/verifyOtp.js"></script>
</body>

</html>
