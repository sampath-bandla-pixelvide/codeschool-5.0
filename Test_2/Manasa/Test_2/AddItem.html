<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Post Your Item</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fa;
      }

      .container-box {
        max-width: 900px;
        margin: 40px auto;
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      h3 {
        font-weight: 700;
        margin-bottom: 20px;
      }

      .form-control,
      .form-select {
        border-radius: 10px;
        height: 45px;
      }

      textarea {
        height: 100px !important;
      }

      .btn-primary {
        background: #6f42c1;
        border: none;
        border-radius: 10px;
        padding: 10px 25px;
      }

      .preview-img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 10px;
        margin-right: 10px;
      }

      .error {
        color: red;
        font-size: 13px;
        margin-top: 3px;
      }
    </style>
  </head>

  <body>
    <i
      class="bi bi-arrow-left fs-4 me-2"
      id="backBtn"
      style="cursor: pointer; margin-top: 10px; margin-left: 100px"
    ></i>

    <div class="container-box">
      <h3>Post Your Item</h3>

      <form id="itemForm">
        <div class="mb-3">
          <label>Type</label>
          <select class="form-select" id="type">
            <option value="lost">Lost</option>
            <option value="found">Found</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Item Title</label>
          <input type="text" id="title" class="form-control" />
          <small class="error" id="titleError"></small>
        </div>

        <div class="mb-3">
          <label>Description</label>
          <textarea id="description" class="form-control"></textarea>
          <small class="error" id="descriptionError"></small>
        </div>

        <div class="mb-3">
          <label>Category</label>
          <select id="category" class="form-select">
            <option>Electronics</option>
            <option>Wallet</option>
            <option>Pets</option>
            <option>Documents</option>
            <option>Others</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Location</label>
          <input type="text" id="location" class="form-control" />
          <small class="error" id="locationError"></small>
        </div>

        <div class="mb-3">
          <label>Contact Info</label>
          <input type="text" id="contact" class="form-control" />
          <small class="error" id="contactError"></small>
        </div>

        <div class="mb-3">
          <label>Upload Images</label>
          <input type="file" id="images" class="form-control" multiple />
          <small class="error" id="imageError"></small>
        </div>

        <div id="preview" class="mb-3 d-flex"></div>

        <button type="submit" class="btn btn-primary">POST NOW</button>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./Scripts/AddItem.js"></script>
  </body>
</html>
